<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ page_title }} · OptiQ Lab{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/lab.min.css') }}?v={{ asset_v }}">
<script defer src="{{ url_for('static', filename='js/vendor/htmx.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/vendor/marked.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/vendor/alpine.min.js') }}"></script>
</head>
<body>

<div class="app">
  <aside class="app-side">
    <a href="{{ url_for('home') }}" class="app-brand">
      <span class="dot"></span>OptiQ <em style="font-style: italic; font-weight: 500;">Lab</em>
    </a>

    {% include '_sidebar.html' %}
  </aside>

  <main class="app-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
